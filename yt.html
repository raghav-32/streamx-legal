
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>YouTube AutoPlay Widget</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>

<div class="player-container">

    <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/219AIFCVQbs?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&enablejsapi=1"
        title="YouTube Live Stream"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
